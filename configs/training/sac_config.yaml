# SAC 训练配置

# 算法
algo: "sac"
env_name: "unitree_g1"

# 训练步数
total_timesteps: 1_000_000

# 随机种子
seed: 42

# 策略网络架构
policy_kwargs:
  net_arch: [256, 256]
  activation_fn: "ReLU"

# SAC 超参数
sac:
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"
  target_update_interval: 1

# 奖励权重
reward_weights:
  forward_vel: 1.0
  upright: 0.5
  torque_penalty: 0.01
  action_smooth: 0.1
  alive: 0.1
  foot_contact: 0.2

# 训练设置
save_freq: 50000
eval_freq: 10000
n_eval_episodes: 10

# 设备
device: "auto"
