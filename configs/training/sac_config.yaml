# SAC Training Configuration

# Algorithm
algo: "sac"
env_name: "unitree_g1"

# Training steps
total_timesteps: 1_000_000

# Random seed
seed: 42

# Policy network architecture
policy_kwargs:
  net_arch: [256, 256]
  activation_fn: "ReLU"

# SAC hyperparameters
sac:
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  learning_starts: 10000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: "auto"
  target_update_interval: 1

# Reward weights
reward_weights:
  forward_vel: 1.0
  upright: 0.5
  torque_penalty: 0.01
  action_smooth: 0.1
  alive: 0.1
  foot_contact: 0.2

# Training settings
save_freq: 50000
eval_freq: 10000
n_eval_episodes: 10

# Device
device: "auto"
