# PPO Training Configuration

# Algorithm
algo: "ppo"
env_name: "unitree_g1"

# Training steps
total_timesteps: 1_000_000

# Random seed
seed: 42

# Policy network architecture
policy_kwargs:
  net_arch: [dict(pi=[256, 256], vf=[256, 256])]
  activation_fn: "Tanh"

# PPO hyperparameters
ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Reward weights
reward_weights:
  forward_vel: 1.0
  upright: 0.5
  torque_penalty: 0.01
  action_smooth: 0.1
  alive: 0.1
  foot_contact: 0.2

# Training settings
save_freq: 50000
eval_freq: 10000
n_eval_episodes: 10

# Device
device: "auto"  # "auto", "cuda", "mps", "cpu"
