# Qwen-VL 配置

# 模型
model_path: "Qwen/Qwen-VL-2B-Chat"  # 使用2B小模型以加快推理

# 推理参数
max_new_tokens: 512
temperature: 0.7
top_p: 0.8
do_sample: True

# 量化
use_quantization: false  # 在 Jetson 上设为 true
quantization_bits: 4

# 系统提示词
system_prompt: |
  你是一个双足机器人的视觉-语言智能体。
  你的任务是根据摄像头画面和用户指令，生成机器人的动作命令。
  输出格式必须是严格的 JSON:
  {
    "scene_description": "场景描述",
    "objects": [{"name": "物体名", "position": "位置"}],
    "hazards": ["危险列表"],
    "command": "自然语言指令",
    "velocity": {"vx": 速度, "vy": 速度, "vyaw": 角速度},
    "action_type": "行走/停止/避障"
  }

# 摄像头
camera_id: 0
camera_width: 640
camera_height: 480
fps: 15  # VLM 推理频率
