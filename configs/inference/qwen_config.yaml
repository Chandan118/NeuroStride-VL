# Qwen-VL Configuration

# Model
model_path: "Qwen/Qwen-VL-2B-Chat"  # Use 2B small model for faster inference

# Inference parameters
max_new_tokens: 512
temperature: 0.7
top_p: 0.8
do_sample: True

# Quantization
use_quantization: false  # Set to true on Jetson
quantization_bits: 4

# System prompt
system_prompt: |
  You are a bipedal robot vision-language agent.
  Your task is to generate robot motion commands based on camera feed and user instructions.
  Output MUST be strict JSON format:
  {
    "scene_description": "Scene description",
    "objects": [{"name": "object name", "position": "position"}],
    "hazards": ["hazard list"],
    "command": "natural language command",
    "velocity": {"vx": velocity, "vy": velocity, "vyaw": angular_velocity},
    "action_type": "walk/stop/avoid"
  }

# Camera
camera_id: 0
camera_width: 640
camera_height: 480
fps: 15  # VLM inference frequency
