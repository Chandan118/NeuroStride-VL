# Mac M2 Pro Hardware Configuration

# Basic info
platform: "macbook_m2_pro"
cpu: "Apple M2 Pro"
gpu: "Apple Silicon GPU (16-core)"
memory: "32GB unified memory"

# PyTorch configuration
torch:
  device: "mps"  # Metal Performance Shaders
  enable_mps: true
  deterministic: false  # MPS doesn't support deterministic algorithms

# Training configuration
training:
  batch_size: 64
  num_workers: 4
  use_amp: true  # Automatic mixed precision
  prefetch_factor: 2

# Simulation
mujoco:
  use_gpu: false  # MuJoCo doesn't use GPU on macOS
  threads: 4

# VLM
vlm:
  model: "Qwen/Qwen-VL-2B-Chat"
  use_quantization: false  # Mac has ample memory, no quantization needed
  device: "mps"
