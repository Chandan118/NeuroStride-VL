# Jetson Orin Nano Hardware Configuration

# Basic info
platform: "jetson_orin_nano"
cpu: "6-core ARM Cortex-A78"
gpu: "NVIDIA Ampere 1024-core GPU"
memory: "8GB LPDDR5"
storage: "32GB eMMC"

# JetPack version
jetpack_version: "6.0"
cuda_version: "11.8"
cudnn_version: "8.9"
tensorrt_version: "8.6"

# PyTorch configuration
torch:
  device: "cuda"
  cuda_device: 0
  use_tensorrt: true

# Inference optimization
inference:
  use_fp16: true  # Half-precision acceleration
  use_int8: false  # Requires calibration
  batch_size: 1

# Control frequency
control:
  loop_frequency: 50.0  # Hz
  policy_inference_freq: 100.0  # Hz

# Power mode
power_mode: "MAXN"  # "MAXN", "5W", "10W", "15W"

# Thermal management
thermal:
  enable_fan: true
  fan_speed: "auto"
  temp_threshold: 80  # °C
