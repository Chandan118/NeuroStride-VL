#
# NOTE: Full installation (torch, mujoco, dm-control) requires
# a GPU environment (Jetson Orin Nano / Mac M2). CI performs
# syntax validation and lightweight lint only.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install lightweight CI dependencies
      run: |
        python -m pip install --upgrade pip
        # Install only lightweight packages for CI (skip torch/mujoco/dm-control)
        pip install numpy flake8 pyflakes

    - name: Lint with flake8 (syntax errors only)
      run: |
        # Only fail on actual syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics           --exclude=.git,__pycache__,build,dist,*.egg-info
        # Style warnings (non-blocking)
        flake8 . --count --exit-zero --max-line-length=127 --statistics           --exclude=.git,__pycache__,build,dist,*.egg-info
      continue-on-error: false

    - name: Python syntax check (all .py files)
      run: |
        find . -name "*.py" -not -path "./.git/*" -not -path "./build/*" | while read f; do
          python3 -m py_compile "$f" && echo "  OK: $f" || echo "  ❌ SYNTAX ERROR: $f"
        done

    - name: Check package structure
      run: |
        echo "=== Repository structure ==="
        ls -la
        echo ""
        echo "=== Python files ==="
        find . -name "*.py" -not -path "./.git/*" | head -30
