# NOTE: Full installation (torch, mujoco, dm-control) requires
# GPU environment (Jetson Orin / Mac M2). CI does syntax validation
# and lint reporting only — does NOT install heavy GPU packages.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install lightweight CI dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy flake8

    - name: Report flake8 issues (non-blocking)
      # Lint issues are reported for awareness but do not fail CI
      # Full code quality should be verified in the local dev environment
      run: |
        flake8 . --count --max-line-length=127 --statistics           --exclude=.git,__pycache__,build,dist,*.egg-info || true

    - name: Python syntax check (hard fail only on parse errors)
      run: |
        ERRORS=0
        while IFS= read -r f; do
          if ! python3 -m py_compile "$f" 2>/dev/null; then
            echo "❌ SYNTAX ERROR: $f"
            python3 -m py_compile "$f"
            ERRORS=$((ERRORS+1))
          fi
        done < <(find . -name "*.py" -not -path "./.git/*" -not -path "./build/*")
        if [ "$ERRORS" -gt 0 ]; then
          echo "Found $ERRORS file(s) with syntax errors"
          exit 1
        else
          echo "✅ All Python files passed syntax check"
        fi

    - name: Repository structure summary
      run: |
        echo "=== Python files ==="
        find . -name "*.py" -not -path "./.git/*" | wc -l
        echo "file(s) found"
        ls -la
