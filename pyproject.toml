[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostride-vl"
version = "0.1.0"
description = "Vision-Language-Action Bipedal Robot Framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NeuroStride-VL Team", email = "contact@neurostride-vl.ai"},
]
keywords = ["robotics", "deep-learning", "reinforcement-learning", "vlm", "bipedal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "stable-baselines3>=2.0.0",
    "gymnasium>=0.28.0",
    "mujoco>=2.3.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "hydra-core>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
]
ros2 = [
    "rclpy>=0.11.0",
    "std_msgs>=0.5.0",
    "geometry_msgs>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/Chandan118/NeuroStride-VL"
Repository = "https://github.com/Chandan118/NeuroStride-VL.git"
Documentation = "https://neurostride-vl.readthedocs.io"
BugTracker = "https://github.com/Chandan118/NeuroStride-VL/issues"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=neurostride --cov-report=html"
